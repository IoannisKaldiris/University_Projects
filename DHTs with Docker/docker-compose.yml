version: '3.8'

networks:
  chord_network:
    driver: bridge

services:
  node0:
    build: .
    container_name: node0
    ports:
      - "5300:5300"
    environment:
      - NODE_ID=0
      - BASE_PORT=5300
    networks:
      - chord_network

  node1:
    build: .
    container_name: node1
    ports:
      - "5301:5301"
    environment:
      - NODE_ID=1
      - BASE_PORT=5300
