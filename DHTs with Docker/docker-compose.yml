      - "5303:5303"
    environment:
      - NODE_ID=3
      - BASE_PORT=5300
    networks:
      - chord_network

  node4:
    build: .
    container_name: node4
    ports:
      - "5304:5304"
    environment:
      - NODE_ID=4
